2" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3412">Key property: no global N×N score/probability matrix</text><text x="132" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7c2d12">When the running row maximum increases, rescale the previous normalization sum and weighted-value accumulator.</text><text x="36" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Evidence source: native Nsight Compute Details / Raw CSV exports · values as collected · not a direct GUI screenshot</text></svg>