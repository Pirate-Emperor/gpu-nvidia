<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#fff"/><text x="42" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#16324f">Steady-state latency: fused cuTile vs deliberately unfused FP32 CuPy</text><text x="42" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6573">Three-session median; benchmark baseline materializes score/probability intermediates.</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="44" y="96" width="532" height="318" rx="12" fill="#f8fafc" stroke="#dce3ea"/><text x="72" y="130" font-size="19" font-weight="700" fill="#16324f">Long D=128 · tile 64×64</text><text x="72" y="155" font-size="14" fill="#5b6573">16.53× speedup · median 0.267059 ms</text><line x1="94" y1="359" x2="525" y2="359" stroke="#9aa4b2"/><line x1="94" y1="198" x2="94" y2="359" stroke="#9aa4b2"/><line x1="94" y1="279" x2="525" y2="279" stroke="#e2e8f0"/><line x1="94" y1="198" x2="525" y2="198" stroke="#e2e8f0"/><rect x="165" y="202" width="98" height="157" rx="4" fill="#4d78a8"/><rect x="343" y="349" width="98" height="10" rx="3" fill="#14a89e"/><text x="214" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#16324f">4.414 ms</text><text x="392" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#087f77">0.267 ms</text><text x="214" y="386" text-anchor="middle" font-size="14" fill="#344054">CuPy baseline</text><text x="392" y="386" text-anchor="middle" font-size="14" fill="#344054">Fused cuTile</text><rect x="624" y="96" width="532" height="318" rx="12" fill="#f8fafc" stroke="#dce3ea"/><text x="652" y="130" font-size="19" font-weight="700" fill="#16324f">Long batched D=128 · tile 64×128</text><text x="652" y="155" font-size="14" fill="#5b6573">18.62× speedup · median 0.919347 ms</text><line x1="674" y1="359" x2="1105" y2="359" stroke="#9aa4b2"/><line x1="674" y1="198" x2="674" y2="359" stroke="#9aa4b2"/><line x1="674" y1="279" x2="1105" y2="279" stroke="#e2e8f0"/><line x1="674" y1="198" x2="1105" y2="198" stroke="#e2e8f0"/><rect x="745" y="199" width="98" height="160" rx="4" fill="#4d78a8"/><rect x="923" y="350" width="98" height="9" rx="3" fill="#14a89e"/><text x="794" y="187" text-anchor="middle" font-size="17" font-weight="700" fill="#16324f">17.127 ms</text><text x="972" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#087f77">0.919 ms</text><text x="794" y="386" text-anchor="middle" font-size="14" fill="#344054">CuPy baseline</text><text x="972" y="386" text-anchor="middle" font-size="14" fill="#344054">Fused cuTile</text></g><text x="44" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Caveat: these ratios are versus the deliberately unfused FP32 CuPy baseline, not FlashAttention or PyTorch SDPA.</text></svg>