<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><rect width="1200" height="390" fill="#fff"/><text x="42" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#16324f">Nsight Compute scheduler snapshot</text><text x="42" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6573">A high no-eligible-warp fraction motivates, but does not prove, a scheduling/latency optimization hypothesis.</text><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="119" font-size="17" font-weight="700" fill="#16324f">Scheduler cycles</text><text x="42" y="162" font-size="15" fill="#344054">Medium · 64×64</text><rect x="235" y="140" width="700" height="32" rx="5" fill="#e9edf2"/><rect x="235" y="140" width="601.0" height="32" rx="5" fill="#4d78a8"/><rect x="836" y="140" width="99" height="32" rx="5" fill="#14a89e"/><text x="525" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">85.83% no eligible warp</text><text x="885" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#073c38">14.17%</text><text x="42" y="218" font-size="15" fill="#344054">Long-batched · 64×128</text><rect x="235" y="196" width="700" height="32" rx="5" fill="#e9edf2"/><rect x="235" y="196" width="596.8" height="32" rx="5" fill="#4d78a8"/><rect x="832" y="196" width="103" height="32" rx="5" fill="#14a89e"/><text x="525" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">85.26% no eligible warp</text><text x="884" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#073c38">14.74%</text><rect x="42" y="267" width="1116" height="82" rx="10" fill="#fff6e5" stroke="#f4d39b"/><text x="64" y="294" font-size="16" font-weight="700" fill="#7a4d08">Important qualification</text><text x="64" y="318" font-size="14" fill="#704214">The profiler's rule-estimated local speedups (33.57% / 46.04%) are heuristics, not measured gains. The detailed PC-sampling</text><text x="64" y="338" font-size="14" fill="#704214">metric was unavailable, so the reports do not identify a single source line as the cause of all issue gaps.</text></g></svg>