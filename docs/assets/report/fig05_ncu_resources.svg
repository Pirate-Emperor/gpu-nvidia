<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#fff"/><text x="42" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#16324f">Nsight Compute: on-chip resource pressure</text><text x="42" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6573">Derived from NCU basic/occupancy report exports for two genuine cuTile launches on RTX 4060.</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="42" y="96" width="350" height="326" rx="12" fill="#f8fafc" stroke="#dce3ea"/><text x="64" y="130" font-size="18" font-weight="700" fill="#16324f">Registers / thread</text><line x1="80" y1="346" x2="358" y2="346" stroke="#9aa4b2"/><rect x="115" y="186" width="76" height="160" rx="4" fill="#4d78a8"/><rect x="242" y="169" width="76" height="177" rx="4" fill="#14a89e"/><text x="153" y="174" font-size="16" font-weight="700" text-anchor="middle" fill="#16324f">231</text><text x="280" y="157" font-size="16" font-weight="700" text-anchor="middle" fill="#087f77">255</text><text x="153" y="371" font-size="13" text-anchor="middle" fill="#344054">Medium</text><text x="280" y="371" font-size="13" text-anchor="middle" fill="#344054">Long-batched</text><rect x="425" y="96" width="350" height="326" rx="12" fill="#f8fafc" stroke="#dce3ea"/><text x="447" y="130" font-size="18" font-weight="700" fill="#16324f">Static shared memory / CTA</text><line x1="463" y1="346" x2="741" y2="346" stroke="#9aa4b2"/><rect x="498" y="205" width="76" height="141" rx="4" fill="#4d78a8"/><rect x="625" y="169" width="76" height="177" rx="4" fill="#14a89e"/><text x="536" y="193" font-size="15" font-weight="700" text-anchor="middle" fill="#16324f">65.54 KiB</text><text x="663" y="157" font-size="15" font-weight="700" text-anchor="middle" fill="#087f77">81.92 KiB</text><text x="536" y="371" font-size="13" text-anchor="middle" fill="#344054">Medium</text><text x="663" y="371" font-size="13" text-anchor="middle" fill="#344054">Long-batched</text><rect x="808" y="96" width="350" height="326" rx="12" fill="#f8fafc" stroke="#dce3ea"/><text x="830" y="130" font-size="18" font-weight="700" fill="#16324f">Achieved occupancy</text><line x1="846" y1="346" x2="1124" y2="346" stroke="#9aa4b2"/><rect x="881" y="169" width="76" height="177" rx="4" fill="#4d78a8"/><rect x="1008" y="170" width="76" height="176" rx="4" fill="#14a89e"/><text x="919" y="157" font-size="15" font-weight="700" text-anchor="middle" fill="#16324f">8.35%</text><text x="1046" y="158" font-size="15" font-weight="700" text-anchor="middle" fill="#087f77">8.33%</text><text x="919" y="371" font-size="13" text-anchor="middle" fill="#344054">Medium</text><text x="1046" y="371" font-size="13" text-anchor="middle" fill="#344054">Long-batched</text></g><text x="44" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Shared-memory CTA residency is the clearest limiting resource in the profile exports: approximately one CTA per SM.</text></svg>