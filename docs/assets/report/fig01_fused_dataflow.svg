<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310"><rect width="1200" height="310" fill="#ffffff"/><text x="42" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#16324f">Fused causal attention: tile-by-tile dataflow</text><text x="42" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b6573">One query tile streams K/V tiles; no global N×N score or probability matrix is written.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle"><rect x="36" y="112" width="130" height="80" rx="12" fill="#e7f3ff" stroke="#3673a5" stroke-width="2"/><text x="101" y="142" font-weight="700" fill="#16324f">Q tile</text><text x="101" y="167" fill="#344054">FP16</text><rect x="198" y="112" width="130" height="80" rx="12" fill="#e7f3ff" stroke="#3673a5" stroke-width="2"/><text x="263" y="142" font-weight="700" fill="#16324f">K tile</text><text x="263" y="167" fill="#344054">FP16</text><rect x="360" y="112" width="145" height="80" rx="12" fill="#eaf7f5" stroke="#12998e" stroke-width="2"/><text x="432" y="142" font-weight="700" fill="#145c57">QKᵀ × scale</text><text x="432" y="167" fill="#344054">FP32 accum.</text><rect x="537" y="112" width="145" height="80" rx="12" fill="#fff4df" stroke="#d28a17" stroke-width="2"/><text x="609" y="142" font-weight="700" fill="#7a4d08">Causal mask</text><text x="609" y="167" fill="#344054">future = −∞</text><rect x="714" y="112" width="165" height="80" rx="12" fill="#eaf7f5" stroke="#12998e" stroke-width="2"/><text x="796" y="140" font-weight="700" fill="#145c57">Online softmax</text><text x="796" y="163" fill="#344054">m, ℓ, u in FP32</text><text x="796" y="182" font-size="12" fill="#344054">update / rescale each tile</text><rect x="911" y="112" width="125" height="80" rx="12" fill="#eaf7f5" stroke="#12998e" stroke-width="2"/><text x="973" y="142" font-weight="700" fill="#145c57">P × V</text><text x="973" y="167" fill="#344054">FP32 acc.</text><rect x="1068" y="112" width="96" height="80" rx="12" fill="#eef0f4" stroke="#697586" stroke-width="2"/><text x="1116" y="142" font-weight="700" fill="#344054">Output</text><text x="1116" y="167" fill="#344054">FP16</text><path d="M166 152 H190 M328 152 H352 M505 152 H529 M682 152 H706 M879 152 H903 M1036 152 H1060" stroke="#6b7280" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/></g><rect x="36" y="225" width="1128" height="54" rx="9" fill="#f5f8fb" stroke="#d7dfe8"/><text x="56" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324f">Stable online-softmax update</text><text x="56" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#344054">m′ = max(m, mₜ); α = exp(m − m′); ℓ′ = αℓ + ΣP; u′ = αu + PV; final output = u / ℓ.</text></svg>