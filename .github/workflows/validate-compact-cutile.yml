name: Validate compact cuTile kernel on local runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-compact-cutile.yml"
      - "src/cutile_attention.py"
      - "src/reference.py"
      - "src/contract.py"
      - "tests/**"
      - "scripts/cutile_smoke.py"
      - "scripts/generate_inputs.py"
      - "scripts/verify_cli_output.py"
      - "scripts/mentor_demo.ps1"
      - "scripts/mentor_step_by_step.ps1"
      - "scripts/mentor_guided.ps1"
      - "scripts/mentor_menu.ps1"
      - "docs/MENTOR_STEP_BY_STEP_WALKTHROUGH.md"
      - "scripts/legal_config_registry.py"
      - "scripts/mentor_numerical_matrix.py"
      - "benchmarks/**"
      - "run_attention.py"

permissions:
  contents: read

jobs:
  script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse mentor PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts\mentor_step_by_step.ps1',
            'scripts\mentor_guided.ps1',
            'scripts\mentor_demo.ps1',
            'scripts\mentor_menu.ps1'
          )
          foreach ($relative in $files) {
            $file = Join-Path $PWD $relative
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $sourceLines = Get-Content -LiteralPath $file
              foreach ($parseError in $errors) {
                $lineNumber = $parseError.Extent.StartLineNumber
                $columnNumber = $parseError.Extent.StartColumnNumber
                $lineText = $sourceLines[$lineNumber - 1]
                Write-Host ("PARSE_ERROR={0}:{1}:{2}: {3}" -f $relative, $lineNumber, $columnNumber, $parseError.Message)
                Write-Host ("SOURCE_LINE={0}" -f $lineText)
              }
              throw "PowerShell syntax validation failed for $relative"
            }
            "POWERSHELL_PARSE_PASS=$relative"
          }
      - name: Compile Python experiment and registry scripts
        run: python -m py_compile scripts/legal_config_registry.py scripts/mentor_numerical_matrix.py benchmarks/benchmark_attention_sessions.py benchmarks/benchmark_attention.py benchmarks/benchmark_load_latency_hints.py
      - name: Validate the editable JSON configuration
        run: python scripts/legal_config_registry.py validate --config tests/legal_attention_configs.json

  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, local]
    timeout-minutes: 90
    steps:
      - name: Checkout exact source commit into the isolated Actions workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify checked-out source commit and required demo files
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Workspace = Join-Path $env:GITHUB_WORKSPACE ".actions-workspace\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $Head = & git -C $Workspace rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Head -ne $env:GITHUB_SHA) {
            throw "Exact Actions source mismatch: expected $env:GITHUB_SHA, found $Head"
          }
          foreach ($Required in @('src/cutile_attention.py','tests/test_gpu_correctness.py','tests/test_gpu_edge_cases.py','scripts/mentor_step_by_step.ps1','scripts/mentor_guided.ps1','scripts/mentor_menu.ps1','scripts/mentor_demo.ps1','run_attention.py')) {
            if (-not (Test-Path -LiteralPath (Join-Path $Workspace $Required))) {
              throw "Checked-out source is missing required file: $Required"
            }
          }
          "VALIDATED_SOURCE_SHA=$Head" | Write-Host
          "ACTIONS_WORKSPACE=$Workspace" | Write-Host

      - name: Parse mentor PowerShell scripts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts\mentor_step_by_step.ps1','scripts\mentor_guided.ps1','scripts\mentor_menu.ps1')) {
            $file = Join-Path (Get-Location) $relative
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $sourceLines = Get-Content -LiteralPath $file
              foreach ($parseError in $errors) {
                $lineNumber = $parseError.Extent.StartLineNumber
                $columnNumber = $parseError.Extent.StartColumnNumber
                $lineText = $sourceLines[$lineNumber - 1]
                Write-Host ("PARSE_ERROR={0}:{1}:{2}: {3}" -f $relative, $lineNumber, $columnNumber, $parseError.Message)
                Write-Host ("SOURCE_LINE={0}" -f $lineText)
              }
              throw "PowerShell syntax validation failed for $relative"
            }
            "POWERSHELL_PARSE_PASS=$relative"
          }

      - name: Locate existing project-local cuTile environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProjectRoot = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE '..\..\..\..')).Path
          $candidates = @(
            (Join-Path $ProjectRoot ".venv-cutile-windows\Scripts\python.exe"),
            (Join-Path (Get-Location) ".venv-cutile-windows\Scripts\python.exe")
          )
          $py = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$py) { throw "Existing project-local cuTile venv not found in the workspace or documented local project root. No packages were installed." }
          "PYTHON_EXE=$py"
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw "Project Python did not run" }
          nvidia-smi
          if ($LASTEXITCODE -ne 0) { throw "nvidia-smi failed" }
          $gpu = nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0 -or !($gpu -match "RTX 4060")) { throw "Expected the local RTX 4060; found: $gpu" }
          "GPU_INVENTORY=$gpu"

      - name: Compile launch synchronize and verify real cuTile runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $py = Join-Path $root ".venv-cutile-windows\Scripts\python.exe"
          if (!(Test-Path $py)) { $py = "C:\Users\Public\GPU-cutile-project\gpu-nvidia\.venv-cutile-windows\Scripts\python.exe" }
          if (!(Test-Path $py)) { throw "Python path not found" }
          & $py scripts/cutile_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Genuine cuTile runtime check failed" }

      - name: Run required core GPU tests with missing cuTile treated as failure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          REQUIRE_CUTILE: "1"
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $py = Join-Path $root ".venv-cutile-windows\Scripts\python.exe"
          if (!(Test-Path $py)) { $py = "C:\Users\Public\GPU-cutile-project\gpu-nvidia\.venv-cutile-windows\Scripts\python.exe" }
          if (!(Test-Path $py)) { throw "Python path not found" }
          & $py -m pytest -q -ra tests/test_gpu_correctness.py tests/test_gpu_edge_cases.py
          if ($LASTEXITCODE -ne 0) { throw "Required cuTile tests failed" }

      - name: Run deterministic CLI and independent NumPy verification
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $py = Join-Path $root ".venv-cutile-windows\Scripts\python.exe"
          if (!(Test-Path $py)) { $py = "C:\Users\Public\GPU-cutile-project\gpu-nvidia\.venv-cutile-windows\Scripts\python.exe" }
          if (!(Test-Path $py)) { throw "Python path not found" }
          $work = Join-Path (Get-Location) ".tmp\logs"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $inFile = Join-Path $work "mentor_attention_input.npz"
          $outFile = Join-Path $work "mentor_attention_output.npy"
          if ([string]::IsNullOrWhiteSpace($inFile) -or [string]::IsNullOrWhiteSpace($outFile)) { throw "Input/output path variable is empty" }
          & $py scripts\generate_inputs.py --output "$inFile" --batch 1 --heads 1 --seq 64 --head-dim 32 --seed 20261018
          if ($LASTEXITCODE -ne 0) { throw "Input generation failed" }
          if (!(Test-Path $inFile)) { throw "Input generator exited successfully but the NPZ file is missing" }
          & $py run_attention.py --input "$inFile" --output "$outFile" --backend cutile --tile-q 64 --tile-k 64
          if ($LASTEXITCODE -ne 0) { throw "CLI execution failed" }
          if (!(Test-Path $outFile)) { throw "CLI exited successfully but the NPY output file is missing" }
          & $py scripts\verify_cli_output.py --input "$inFile" --output "$outFile"
          if ($LASTEXITCODE -ne 0) { throw "Independent NumPy output verification failed" }

      - name: Check all 29 legal cuTile numerical configurations
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          REQUIRE_CUTILE: "1"
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $py = Join-Path $root ".venv-cutile-windows\Scripts\python.exe"
          if (!(Test-Path $py)) { $py = "C:\Users\Public\GPU-cutile-project\gpu-nvidia\.venv-cutile-windows\Scripts\python.exe" }
          if (!(Test-Path $py)) { throw "Python path not found" }
          $work = Join-Path $root ".tmp\logs"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $matrix = Join-Path $work "validation_legal_numerical_matrix.json"
          & $py scripts\mentor_numerical_matrix.py --output $matrix
          if ($LASTEXITCODE -ne 0) { throw "Legal numerical matrix failed" }
          if (!(Test-Path $matrix)) { throw "Numerical matrix output is missing" }
          $report = Get-Content -Raw $matrix | ConvertFrom-Json
          if ($report.expected_legal_pair_count -lt 29) { throw "The registry must retain the 29 original configurations" }
          if ($report.legal_pair_count -ne $report.expected_legal_pair_count -or $report.pass_count -ne $report.expected_legal_pair_count -or $report.fail_count -ne 0) { throw "Numerical matrix did not pass every configuration recorded in the JSON registry" }

      - name: Exercise one-by-one mentor walkthrough core path
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\mentor_step_by_step.ps1 -Standard -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Complete ten-step mentor walkthrough failed with exit code $LASTEXITCODE" }

      - name: Exercise guided kernel explanation and individual correctness runs
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          REQUIRE_CUTILE: "1"
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\mentor_step_by_step.ps1 -Guided -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Complete guided mentor walkthrough failed with exit code $LASTEXITCODE" }

      - name: Run the exact reusable mentor demo script end to end
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\mentor_demo.ps1
          if ($LASTEXITCODE -ne 0) { throw "Reusable mentor demo failed with exit code $LASTEXITCODE" }

      - name: Exercise mentor demo benchmark and Nsight Compute switches
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\mentor_demo.ps1 -WithProfile
          if ($LASTEXITCODE -ne 0) { throw "Full mentor demo with tile sweep and Nsight attempt failed with exit code $LASTEXITCODE" }

      - name: Safely fast-forward the local project checkout
        id: local_sync
        continue-on-error: true
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProjectRoot = 'C:\Users\Public\GPU-cutile-project\gpu-nvidia'
          if (-not (Test-Path -LiteralPath (Join-Path $ProjectRoot '.git'))) {
            throw "Local project checkout is not a Git repository: $ProjectRoot. No local files were changed."
          }
          $Git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $Git) { $Git = Get-Command git -ErrorAction SilentlyContinue }
          if (-not $Git) { throw 'Git executable is unavailable; local checkout was not changed.' }

          $RemoteNames = & $Git.Source -C $ProjectRoot remote
          if ($LASTEXITCODE -ne 0 -or $RemoteNames -notcontains 'origin') {
            throw "Local checkout has no origin remote. No local files were changed."
          }
          $RemoteUrl = & $Git.Source -C $ProjectRoot remote get-url origin
          if ($LASTEXITCODE -ne 0 -or $RemoteUrl -notmatch '(^|[:/])xemptynothing/gpu-nvidia(\.git)?$') {
            throw "Local origin is not xemptynothing/gpu-nvidia: $RemoteUrl. No local files were changed."
          }
          $Branch = & $Git.Source -C $ProjectRoot branch --show-current
          if ($LASTEXITCODE -ne 0 -or $Branch -ne 'main') {
            throw "Local checkout is on '$Branch', not main. No local files were changed."
          }
          $Dirty = & $Git.Source -C $ProjectRoot status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect local Git status; no local files were changed.' }
          if ($Dirty) {
            $Dirty | ForEach-Object { Write-Host "LOCAL_DIRTY=$_" }
            throw "Local checkout contains uncommitted or untracked files. They were preserved; refusing to overwrite them."
          }

          $Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          & $Git.Source -C $ProjectRoot -c "http.extraheader=AUTHORIZATION: basic $Auth" fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Fetching origin/main failed; local checkout was not changed.' }
          $Counts = & $Git.Source -C $ProjectRoot rev-list --left-right --count HEAD...origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compare local HEAD with origin/main.' }
          $Parts = ($Counts -split '\s+') | Where-Object { $_ -ne '' }
          $Ahead = [int]$Parts[0]
          $Behind = [int]$Parts[1]
          if ($Ahead -eq 0 -and $Behind -gt 0) {
            & $Git.Source -C $ProjectRoot merge --ff-only origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Fast-forward failed; local checkout was not reset or cleaned.' }
          }
          elseif ($Ahead -gt 0 -or $Behind -gt 0) {
            throw "Local main and origin/main have diverged (ahead=$Ahead, behind=$Behind). No local commits or files were discarded."
          }
          $LocalHead = & $Git.Source -C $ProjectRoot rev-parse HEAD
          $RemoteHead = & $Git.Source -C $ProjectRoot rev-parse origin/main
          if ($LASTEXITCODE -ne 0 -or $LocalHead -ne $RemoteHead) {
            throw "Local checkout did not reach origin/main (local=$LocalHead, remote=$RemoteHead)."
          }
          "LOCAL_REPO_STATUS=SYNCED" | Write-Host
          "LOCAL_REPO_HEAD=$LocalHead" | Write-Host
          "LOCAL_REPO_PATH=$ProjectRoot" | Write-Host

      - name: Require successful local checkout synchronization
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: .actions-workspace/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ('${{ steps.local_sync.outcome }}' -ne 'success') {
            throw 'The demo validation ran from the exact Actions commit, but the local project checkout could not be fast-forwarded safely. Review the LOCAL_DIRTY / divergence lines; no local files were overwritten.'
          }
          'LOCAL_CHECKOUT_SYNC_VERIFIED=PASS' | Write-Host
