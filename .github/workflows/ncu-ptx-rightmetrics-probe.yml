name: Probe corrected PTX right-metrics horizontal scroll

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ncu-ptx-rightmetrics-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, x64, local]
    timeout-minutes: 15
    steps:
      - name: Capture baseline and right-metrics horizontal scroll on one existing report
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\Public\GPU-cutile-project\gpu-nvidia'
          $profile = 'long_d128-tq128-tk128-lat0'
          $runDir = Join-Path $root 'results\ncu\rtx4060\legal-matrix-41206212024'
          $report = Join-Path (Join-Path $runDir $profile) ($profile + '.ncu-repz')
          $ncu = 'C:\Program Files\NVIDIA Corporation\Nsight Compute 2026.3.1\target\windows-desktop-win7-x64\ncu.exe'
          $py = Join-Path $root '.venv-cutile-windows\Scripts\python.exe'
          $helper = Join-Path $root 'scripts\capture_ncu_analysis_screenshots.py'
          foreach ($p in @($report,$ncu,$py,$helper)) { if (-not (Test-Path -LiteralPath $p)) { throw "Missing required file: $p" } }
          $out = Join-Path $runDir ("ptx-rightmetrics-probe-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $code = @'
import argparse, ctypes, hashlib, importlib.util, json, subprocess, time
from pathlib import Path
from PIL import Image, ImageChops
ap=argparse.ArgumentParser()
ap.add_argument("--ncu",type=Path,required=True)
ap.add_argument("--helper",type=Path,required=True)
ap.add_argument("--report",type=Path,required=True)
ap.add_argument("--out",type=Path,required=True)
a=ap.parse_args()
sp=importlib.util.spec_from_file_location("cap",a.helper)
cap=importlib.util.module_from_spec(sp);sp.loader.exec_module(cap)
ui=cap._ui_path(a.ncu)
if not ui: raise RuntimeError("ncu-ui.exe not found")
p=subprocess.Popen([str(ui),str(a.report.resolve())],cwd=str(a.report.parent),stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
win=cap._wait_window(p.pid,a.report.stem,60) or cap._wait_window(None,a.report.stem,10)
if not win: raise RuntimeError("Nsight report window not found")
hwnd=win["hwnd"]
cap.user32.ShowWindow(cap.HWND(hwnd),cap.SW_MAXIMIZE)
cap.user32.SetForegroundWindow(cap.HWND(hwnd))
time.sleep(1.5)
cap._click_relative(hwnd,230,212,verify_y=225)
time.sleep(.8)
cap._click_at(hwnd,300,253,pause=.25)
cap._type_key(ord("P"));cap._type_key(0x0D);time.sleep(1.0)
base=a.out/"ptx-rightmetrics-baseline.png"
after=a.out/"ptx-rightmetrics-after-scroll.png"
cap._capture(hwnd,base)
rect=cap.RECT()
if not cap.user32.GetWindowRect(cap.HWND(hwnd),ctypes.byref(rect)): raise RuntimeError("GetWindowRect failed")
w,h=rect.right-rect.left,rect.bottom-rect.top
x=rect.left+int(w*.75)
y=rect.top+int(h*.58)
if not cap.user32.SetCursorPos(x,y): raise RuntimeError("SetCursorPos failed")
time.sleep(.2)
target=cap.user32.WindowFromPoint(cap.POINT(x,y))
buf=ctypes.create_unicode_buffer(256)
cap.user32.GetClassNameW(target,buf,256)
delta=ctypes.c_uint32((120*12)&0xffffffff).value
cap.user32.mouse_event(cap.MOUSEEVENTF_HWHEEL,0,0,delta,None)
time.sleep(1.0)
cap._capture(hwnd,after)
im1=Image.open(base).convert("RGB").crop((1300,260,1590,720))
im2=Image.open(after).convert("RGB").crop((1300,260,1590,720))
diff=ImageChops.difference(im1,im2)
hist=diff.convert("L").histogram()
total=sum(hist)
changed=sum(hist[16:])
ratio=changed/total
mean=sum(i*n for i,n in enumerate(hist))/total
sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
manifest={"profile":a.report.parent.name,"mode":"PTX","panel":"right-metrics","target_x":x,"target_y":y,
 "target_class":buf.value,"target_crop":[1300,260,1590,720],"changed_pixel_ratio_gt_15":ratio,
 "mean_absolute_pixel_difference":mean,"baseline_sha256":sha(base),"after_sha256":sha(after),
 "baseline":base.name,"after":after.name,"success":bool(ratio>.005)}
(a.out/"probe.json").write_text(json.dumps(manifest,indent=2))
print(json.dumps(manifest,indent=2))
if ratio<=.005:raise SystemExit("PTX right-metrics pane did not materially change")
'@
          $script = Join-Path $env:RUNNER_TEMP 'ncu_ptx_rightmetrics_probe.py'
          [IO.File]::WriteAllText($script,$code,[Text.UTF8Encoding]::new($false))
          & $py $script --ncu $ncu --helper $helper --report $report --out $out
          if ($LASTEXITCODE -ne 0) { throw "PTX right-metrics probe failed: $LASTEXITCODE" }

      - name: Upload right-metrics probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncu-ptx-rightmetrics-probe-${{ github.run_id }}
          path: C:\Users\Public\GPU-cutile-project\gpu-nvidia\results\ncu\rtx4060\legal-matrix-41206212024\ptx-rightmetrics-probe-${{ github.run_id }}\
          if-no-files-found: warn
          retention-days: 30
