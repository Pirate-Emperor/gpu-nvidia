name: A100 correctness

on:
  workflow_dispatch:
  # One-shot automatic trigger so the self-hosted GPU runner is exercised
  # from this repository without depending on a manual UI dispatch.
  push:
    paths:
      - ".github/workflows/a100-correctness.yml"

jobs:
  correctness:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate compute-node core_config
        shell: bash
        run: |
          set -euo pipefail
          CORE_CONFIG_FILE="$(
            find "$HOME/gpu/project" -maxdepth 6 -type f \(               -name "core_config.py" -o               -path "*/core_config/__init__.py"             \) -print -quit 2>/dev/null || true
          )"
          if [ -z "$CORE_CONFIG_FILE" ]; then
            echo "ERROR: core_config module was not found under $HOME/gpu/project"
            echo "Visible candidate paths:"
            find "$HOME/gpu/project" -maxdepth 5 \( -name "core_config.py" -o -path "*/core_config" \) -print 2>/dev/null | head -50 || true
            exit 1
          fi
          CORE_CONFIG_DIR="$(dirname "$CORE_CONFIG_FILE")"
          echo "Found core_config at: $CORE_CONFIG_FILE"
          echo "CORE_CONFIG_DIR=$CORE_CONFIG_DIR" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$CORE_CONFIG_DIR:${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          python3 scripts/with_core_config.py .venv/bin/python -m pip install --upgrade pip
          python3 scripts/with_core_config.py .venv/bin/python -m pip install -r requirements-dev.txt
          python3 scripts/with_core_config.py .venv/bin/python -m pip install "cupy-cuda13x" "cuda-tile[tileiras]"

      - name: Verify A100/cuTile stack
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi --query-gpu=name,driver_version,memory.total,compute_cap --format=csv
          .venv/bin/python -c "import core_config; print('core_config import: OK')"
          .venv/bin/python -c "import cupy; print('CuPy:', cupy.__version__)"
          .venv/bin/python -c "import cuda.tile as ct; print('cuTile import: OK')"
          .venv/bin/python scripts/environment_check.py

      - name: Run complete correctness suite
        shell: bash
        env:
          REQUIRE_A100: "1"
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q
