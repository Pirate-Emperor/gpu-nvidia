name: A100 correctness

on:
  workflow_dispatch:
  # One-shot automatic trigger so the self-hosted GPU runner is exercised
  # from this repository without depending on a manual UI dispatch.
  push:
    paths:
      - ".github/workflows/a100-correctness.yml"

concurrency:
  group: a100-correctness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run CPU reference and contract tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 scripts/with_core_config.py python3 -m venv .venv-cpu
          python3 scripts/with_core_config.py .venv-cpu/bin/python -m pip install --upgrade pip
          python3 scripts/with_core_config.py .venv-cpu/bin/python -m pip install -r requirements-dev.txt
          .venv-cpu/bin/python -m pytest -q -m "not gpu"

  correctness:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify compute-node Python environment
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 -c "import core_config, inspect, os; print('core_config:', inspect.getfile(core_config)); print('HTTP_PROXY configured:', bool(os.environ.get('HTTP_PROXY'))); print('HTTPS_PROXY configured:', bool(os.environ.get('HTTPS_PROXY')))"

      - name: Check cuTile driver prerequisite
        shell: bash
        run: |
          set -euo pipefail
          DRIVER_VERSION="$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | xargs)"
          DRIVER_MAJOR="${DRIVER_VERSION%%.*}"
          echo "NVIDIA driver: ${DRIVER_VERSION}"
          if [ "$DRIVER_MAJOR" -lt 580 ]; then
            echo "ERROR: cuTile requires NVIDIA driver R580 or later; this node has ${DRIVER_VERSION}."
            echo "Use an A100 node with R580+ (preferred), or have the cluster administrator provide a supported CUDA forward-compatibility configuration."
            exit 1
          fi

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 -m venv .venv
          python3 scripts/with_core_config.py .venv/bin/python -m pip install --upgrade pip
          python3 scripts/with_core_config.py .venv/bin/python -m pip install -r requirements-dev.txt
          python3 scripts/with_core_config.py .venv/bin/python -m pip install "cupy-cuda13x" "cuda-tile[tileiras]"

      - name: Verify A100/cuTile stack
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          nvidia-smi --query-gpu=name,driver_version,memory.total,compute_cap --format=csv
          .venv/bin/python -c "import core_config; print('core_config import in venv: OK')"
          .venv/bin/python -c "import cupy; print('CuPy:', cupy.__version__)"
          .venv/bin/python -c "import cuda.tile as ct; print('cuTile import: OK')"
          .venv/bin/python scripts/environment_check.py

      - name: Run complete correctness suite
        shell: bash
        env:
          REQUIRE_A100: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          .venv/bin/python -m pytest -q
