name: PyTorch SDPA venv compatibility preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/torch-sdpa-preflight.yml"

permissions:
  contents: read

jobs:
  sdpa-venv-preflight:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Verify project venv and dry-run official CUDA PyTorch install (no package changes)
        shell: cmd
        run: |
          set "PROJECT_ROOT=C:\Users\Public\GPU-cutile-project\gpu-nvidia"
          set "PY=%PROJECT_ROOT%\.venv-cutile-windows\Scripts\python.exe"
          set "TEMP=%PROJECT_ROOT%\.tmp"
          set "TMP=%PROJECT_ROOT%\.tmp"
          set "PIP_CACHE_DIR=%PROJECT_ROOT%\.cache\pip"
          if not exist "%PY%" (echo Approved venv missing: %PY% & exit /b 1)
          if not exist "%TEMP%" mkdir "%TEMP%"
          if not exist "%PIP_CACHE_DIR%" mkdir "%PIP_CACHE_DIR%"
          echo PROJECT_ROOT=%PROJECT_ROOT%
          echo PYTHON_EXE=%PY%
          "%PY%" --version
          if errorlevel 1 exit /b 1
          "%PY%" -m pip --version
          if errorlevel 1 exit /b 1
          "%PY%" -m pip freeze > "%TEMP%\torch-sdpa-preflight-before.txt"
          nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total,memory.free --format=csv,noheader
          if errorlevel 1 exit /b 1
          "%PY%" -c "import importlib.metadata as m; names=['numpy','cupy-cuda13x','cuda-tile','nvidia-cuda-tileiras','nvidia-cuda-nvcc','nvidia-nvvm','torch']; print('\\n'.join(f'{n}='+next((d.version for d in m.distributions() if d.metadata.get('Name','').lower().replace('_','-')==n),'<not installed>') for n in names))"
          if errorlevel 1 exit /b 1
          "%PY%" -m pip install --disable-pip-version-check --dry-run --report "%TEMP%\torch-sdpa-install-plan.json" --cache-dir "%PIP_CACHE_DIR%" --index-url "https://download.pytorch.org/whl/cu130" "torch==2.14.0"
          if errorlevel 1 (echo PyTorch dry-run failed; no package changes were made. & exit /b 1)
          "%PY%" -c "import json; p=json.load(open(r'%TEMP%\\torch-sdpa-install-plan.json',encoding='utf-8')); print('PLANNED_INSTALLS:'); [print(i['metadata']['name']+'=='+i['metadata']['version']) for i in p.get('install',[])]; print('INSTALL_COUNT='+str(len(p.get('install',[]))))"
          if errorlevel 1 exit /b 1
