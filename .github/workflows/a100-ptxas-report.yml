name: A100 tile PTXAS resource report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/shared_tile_cuda_attention.py"
      - "src/variants/shared_tile_v1.py"
      - "src/variants/shared_tile_v2.py"
      - "src/variants/shared_tile_v3.py"
      - "src/variants/shared_tile_v4.py"
      - "src/variants/shared_tile_v5.py"
      - "scripts/ptxas_tile_report.py"
      - ".github/workflows/a100-ptxas-report.yml"

concurrency:
  group: a100-ptxas-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native CUDA environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup_native_env.sh
      - name: Compile resource report
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p results/runs
          "${NATIVE_VENV}/bin/python" scripts/ptxas_tile_report.py | tee "results/runs/${stamp}_A100_ptxas.json"
      - name: Upload PTXAS report
        uses: actions/upload-artifact@v4
        with:
          name: a100-ptxas-${{ github.run_id }}
          path: results/runs/*_A100_ptxas.json
          if-no-files-found: error
