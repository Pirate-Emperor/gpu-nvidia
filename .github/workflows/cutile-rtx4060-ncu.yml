name: RTX 4060 actual cuTile Nsight Compute profiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutile-rtx4060-ncu.yml"
      - "src/cutile_attention.py"
      - "benchmarks/profile_fused.py"
      - "benchmarks/benchmark_load_latency_hints.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncu-profiles:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      # Keep reports from the prior run: its capture succeeded, but upload omitted .ncu-repz.
      - name: Checkout source without deleting existing reports
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Recover or capture and export two cuTile Nsight Compute reports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProjectRoot = (Resolve-Path (Join-Path $PWD '..\..\..\..')).Path
          $Py = Join-Path $ProjectRoot '.venv-cutile-windows\Scripts\python.exe'
          if (-not (Test-Path $Py)) { throw "Project-local Python is missing: $Py" }

          $NcuPath = $null
          $NcuCommand = Get-Command ncu.exe -ErrorAction SilentlyContinue
          if ($NcuCommand) { $NcuPath = $NcuCommand.Source }
          if (-not $NcuPath) {
            $SearchRoots = @()
            if ($env:ProgramFiles) { $SearchRoots += (Join-Path $env:ProgramFiles 'NVIDIA Corporation') }
            if ($env:LOCALAPPDATA) { $SearchRoots += (Join-Path $env:LOCALAPPDATA 'NVIDIA Corporation') }
            foreach ($SearchRoot in $SearchRoots) {
              if (-not (Test-Path $SearchRoot)) { continue }
              $InstallDirs = Get-ChildItem -Path $SearchRoot -Directory -Filter 'Nsight Compute*' -ErrorAction SilentlyContinue
              foreach ($InstallDir in $InstallDirs) {
                $Found = Get-ChildItem -Path $InstallDir.FullName -Filter 'ncu.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($Found) { $NcuPath = $Found.FullName; break }
              }
              if ($NcuPath) { break }
            }
          }
          if (-not $NcuPath) { throw 'Nsight Compute CLI was not found in PATH or NVIDIA install folders.' }

          New-Item -ItemType Directory -Force -Path results | Out-Null
          "PROJECT_ROOT=$ProjectRoot" | Tee-Object -FilePath cutile-ncu-profile-status.log
          "PYTHON_EXE=$Py" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
          "NCU_PATH=$NcuPath" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
          & $NcuPath --version 2>&1 | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Nsight Compute CLI --version failed.' }

          $MediumBase = 'results/cutile-profile-medium'
          $LongBase = 'results/cutile-profile-long-batched'
          $MediumExists = (Test-Path "$MediumBase.ncu-repz") -or (Test-Path "$MediumBase.ncu-rep")
          $LongExists = (Test-Path "$LongBase.ncu-repz") -or (Test-Path "$LongBase.ncu-rep")
          if ($MediumExists -and $LongExists) {
            'REUSED_EXISTING_PROFILES=True' | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
          } else {
            'REUSED_EXISTING_PROFILES=False; generating any missing report(s).' | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
            if (-not $MediumExists) {
              & $NcuPath --set basic --launch-skip 6 --launch-count 1 --force-overwrite -o $MediumBase $Py benchmarks/profile_fused.py --case medium_d128 --tile-q 64 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-medium.log
              if ($LASTEXITCODE -ne 0) { throw 'Nsight Compute capture failed for medium_d128 64x64.' }
            }
            if (-not $LongExists) {
              & $NcuPath --set basic --launch-skip 6 --launch-count 1 --force-overwrite -o $LongBase $Py benchmarks/profile_fused.py --case longer_batched_d128 --tile-q 64 --tile-k 128 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-long-batched.log
              if ($LASTEXITCODE -ne 0) { throw 'Nsight Compute capture failed for longer_batched_d128 64x128.' }
            }
          }

          $MediumReport = @("$MediumBase.ncu-repz", "$MediumBase.ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $LongReport = @("$LongBase.ncu-repz", "$LongBase.ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $MediumReport -or -not $LongReport) { throw 'Both profiler reports must exist before exporting.' }

          foreach ($Item in @(
            @{ Label = 'medium'; Report = $MediumReport; Base = $MediumBase },
            @{ Label = 'long-batched'; Report = $LongReport; Base = $LongBase }
          )) {
            "REPORT=$($Item.Report)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
            "REPORT_BYTES=$((Get-Item $Item.Report).Length)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
            & $NcuPath --import $Item.Report --page details 2>&1 | Tee-Object -FilePath "$($Item.Base)-details.txt"
            if ($LASTEXITCODE -ne 0) { throw "Could not export details for $($Item.Label)." }
            & $NcuPath --import $Item.Report --page raw --csv 2>&1 | Tee-Object -FilePath "$($Item.Base)-raw.csv"
            if ($LASTEXITCODE -ne 0) { throw "Could not export raw metrics for $($Item.Label)." }
          }

          # Collect scheduler and warp-state stall reasons in dedicated reports.
          # These sections are distinct from the basic throughput/resource report.
          $MediumStallBase = 'results/cutile-profile-medium-stalls'
          $LongStallBase = 'results/cutile-profile-long-batched-stalls'
          & $NcuPath --section SchedulerStats --section WarpStateStats --launch-skip 6 --launch-count 1 --force-overwrite -o $MediumStallBase $Py benchmarks/profile_fused.py --case medium_d128 --tile-q 64 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-medium-stalls.log
          if ($LASTEXITCODE -ne 0) { throw 'Scheduler/warp-state profile failed for medium_d128 64x64.' }
          & $NcuPath --section SchedulerStats --section WarpStateStats --launch-skip 6 --launch-count 1 --force-overwrite -o $LongStallBase $Py benchmarks/profile_fused.py --case longer_batched_d128 --tile-q 64 --tile-k 128 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-long-batched-stalls.log
          if ($LASTEXITCODE -ne 0) { throw 'Scheduler/warp-state profile failed for longer_batched_d128 64x128.' }

          $MediumStallReport = @("$MediumStallBase.ncu-repz", "$MediumStallBase.ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $LongStallReport = @("$LongStallBase.ncu-repz", "$LongStallBase.ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $MediumStallReport -or -not $LongStallReport) { throw 'Both scheduler/warp-state reports must exist before exporting.' }

          foreach ($Item in @(
            @{ Label = 'medium-stalls'; Report = $MediumStallReport; Base = $MediumStallBase },
            @{ Label = 'long-batched-stalls'; Report = $LongStallReport; Base = $LongStallBase }
          )) {
            "STALL_REPORT=$($Item.Report)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
            "STALL_REPORT_BYTES=$((Get-Item $Item.Report).Length)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
            & $NcuPath --import $Item.Report --page details 2>&1 | Tee-Object -FilePath "$($Item.Base)-details.txt"
            if ($LASTEXITCODE -ne 0) { throw "Could not export stall details for $($Item.Label)." }
            & $NcuPath --import $Item.Report --page raw --csv 2>&1 | Tee-Object -FilePath "$($Item.Base)-raw.csv"
            if ($LASTEXITCODE -ne 0) { throw "Could not export raw stall metrics for $($Item.Label)." }
          }

          # Profile candidate latency hints on the same two workloads. These
          # captures are a comparison, not an assumed optimization win.
          $HintProfiles = @(
            @{ Label = 'medium-latency4'; Case = 'medium_d128'; TQ = 64; TK = 64; Latency = 4 },
            @{ Label = 'medium-latency8'; Case = 'medium_d128'; TQ = 64; TK = 64; Latency = 8 },
            @{ Label = 'long-batched-latency4'; Case = 'longer_batched_d128'; TQ = 64; TK = 128; Latency = 4 },
            @{ Label = 'long-batched-latency8'; Case = 'longer_batched_d128'; TQ = 64; TK = 128; Latency = 8 }
          )
          foreach ($Hint in $HintProfiles) {
            $Base = "results/cutile-profile-$($Hint.Label)"
            $Log = "cutile-profile-$($Hint.Label).log"
            & $NcuPath --set basic --launch-skip 6 --launch-count 1 --force-overwrite -o $Base $Py benchmarks/profile_fused.py --case $Hint.Case --tile-q $Hint.TQ --tile-k $Hint.TK --warmup 5 --load-latency $Hint.Latency 2>&1 | Tee-Object -FilePath $Log
            if ($LASTEXITCODE -ne 0) {
              "HINT_PROFILE_FAILED=$($Hint.Label)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
              throw "Nsight Compute capture failed for hint profile $($Hint.Label)."
            }
            $Report = @("$Base.ncu-repz", "$Base.ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $Report) { throw "Expected native report missing for $($Hint.Label)." }
            & $NcuPath --import $Report --page details 2>&1 | Tee-Object -FilePath "$Base-details.txt"
            if ($LASTEXITCODE -ne 0) { throw "Detail export failed for $($Hint.Label)." }
            & $NcuPath --import $Report --page raw --csv 2>&1 | Tee-Object -FilePath "$Base-raw.csv"
            if ($LASTEXITCODE -ne 0) { throw "Raw metric export failed for $($Hint.Label)." }
            "HINT_PROFILE=$($Hint.Label) REPORT=$Report BYTES=$((Get-Item $Report).Length)" | Tee-Object -FilePath cutile-ncu-profile-status.log -Append
          }

                    # Optional UI snapshots: open the native report in Nsight Compute and
          # capture only that window (not the whole desktop) via PrintWindow.
          # If no interactive UI/session is available, record the limitation and
          # keep the exported metrics/artifact; do not create synthetic screenshots.
          $ScreenshotDir = 'results/profiler-screenshots'
          New-Item -ItemType Directory -Force -Path $ScreenshotDir | Out-Null
          $UiPath = $null
          $UiRoots = @((Split-Path -Parent $NcuPath), $env:ProgramFiles)
          foreach ($Root in $UiRoots) {
            if (-not $Root -or -not (Test-Path $Root)) { continue }
            $Ui = Get-ChildItem -Path $Root -Filter 'ncu-ui.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($Ui) { $UiPath = $Ui.FullName; break }
          }
          if (-not $UiPath) {
            'NCU_GUI_SNAPSHOTS=SKIPPED; ncu-ui.exe could not be located.' | Tee-Object -FilePath cutile-ncu-screenshot-status.log
          } else {
            "NCU_UI_PATH=$UiPath" | Tee-Object -FilePath cutile-ncu-screenshot-status.log
            Add-Type -AssemblyName System.Drawing
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NcuWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
          }
          '@
            $ScreenshotReports = @(
              @{ Label='medium-basic'; Path='results/cutile-profile-medium' },
              @{ Label='long-batched-basic'; Path='results/cutile-profile-long-batched' },
              @{ Label='medium-scheduler'; Path='results/cutile-profile-medium-stalls' },
              @{ Label='long-batched-scheduler'; Path='results/cutile-profile-long-batched-stalls' },
              @{ Label='medium-latency4'; Path='results/cutile-profile-medium-latency4' },
              @{ Label='medium-latency8'; Path='results/cutile-profile-medium-latency8' },
              @{ Label='long-batched-latency4'; Path='results/cutile-profile-long-batched-latency4' },
              @{ Label='long-batched-latency8'; Path='results/cutile-profile-long-batched-latency8' }
            )
            $Manifest = @()
            foreach ($Entry in $ScreenshotReports) {
              $ReportFile = @("$($Entry.Path).ncu-repz", "$($Entry.Path).ncu-rep") | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $ReportFile) {
                "SNAPSHOT_SKIPPED=$($Entry.Label); native report absent." | Tee-Object -FilePath cutile-ncu-screenshot-status.log -Append
                continue
              }
              try {
                $Arg = '"' + (Resolve-Path $ReportFile).Path + '"'
                $Started = Start-Process -FilePath $UiPath -ArgumentList $Arg -PassThru -WindowStyle Maximized
                Start-Sleep -Seconds 8
                $Started.Refresh()
                $WindowProcess = $Started
                if ($WindowProcess.MainWindowHandle -eq [IntPtr]::Zero) {
                  $Candidates = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match '^ncu-ui

      - name: Upload actual-cuTile reports and metric exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutile-rtx4060-ncu-profiles
          path: |
            cutile-ncu-profile-status.log
            cutile-ncu-screenshot-status.log
            results/profiler-screenshots/**
            cutile-profile-medium.log
            cutile-profile-long-batched.log
            cutile-profile-medium-stalls.log
            cutile-profile-long-batched-stalls.log
            results/cutile-profile-medium-stalls.ncu-repz
            results/cutile-profile-medium-stalls.ncu-rep
            results/cutile-profile-medium-stalls-details.txt
            results/cutile-profile-medium-stalls-raw.csv
            results/cutile-profile-long-batched-stalls.ncu-repz
            results/cutile-profile-long-batched-stalls.ncu-rep
            results/cutile-profile-long-batched-stalls-details.txt
            results/cutile-profile-long-batched-stalls-raw.csv
            results/cutile-profile-medium.ncu-repz
            results/cutile-profile-medium.ncu-rep
            results/cutile-profile-medium-details.txt
            results/cutile-profile-medium-raw.csv
            results/cutile-profile-long-batched.ncu-repz
            results/cutile-profile-long-batched.ncu-rep
            results/cutile-profile-long-batched-details.txt
            results/cutile-profile-long-batched-raw.csv
            cutile-profile-medium-latency4.log
            results/cutile-profile-medium-latency4.ncu-repz
            results/cutile-profile-medium-latency4.ncu-rep
            results/cutile-profile-medium-latency4-details.txt
            results/cutile-profile-medium-latency4-raw.csv
            cutile-profile-medium-latency8.log
            results/cutile-profile-medium-latency8.ncu-repz
            results/cutile-profile-medium-latency8.ncu-rep
            results/cutile-profile-medium-latency8-details.txt
            results/cutile-profile-medium-latency8-raw.csv
            cutile-profile-long-batched-latency4.log
            results/cutile-profile-long-batched-latency4.ncu-repz
            results/cutile-profile-long-batched-latency4.ncu-rep
            results/cutile-profile-long-batched-latency4-details.txt
            results/cutile-profile-long-batched-latency4-raw.csv
            cutile-profile-long-batched-latency8.log
            results/cutile-profile-long-batched-latency8.ncu-repz
            results/cutile-profile-long-batched-latency8.ncu-rep
            results/cutile-profile-long-batched-latency8-details.txt
            results/cutile-profile-long-batched-latency8-raw.csv
          if-no-files-found: error
 -and $_.MainWindowHandle -ne [IntPtr]::Zero } | Sort-Object StartTime -Descending
                  if ($Candidates) { $WindowProcess = $Candidates | Select-Object -First 1 }
                }
                if ($WindowProcess.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Nsight GUI main window handle unavailable (likely no interactive desktop session).' }
                [NcuWindowCapture]::ShowWindow($WindowProcess.MainWindowHandle, 3) | Out-Null
                [NcuWindowCapture]::SetForegroundWindow($WindowProcess.MainWindowHandle) | Out-Null
                Start-Sleep -Seconds 3
                $Rect = New-Object NcuWindowCapture+RECT
                if (-not [NcuWindowCapture]::GetWindowRect($WindowProcess.MainWindowHandle, [ref]$Rect)) { throw 'GetWindowRect failed.' }
                $Width = $Rect.Right - $Rect.Left
                $Height = $Rect.Bottom - $Rect.Top
                if ($Width -lt 700 -or $Height -lt 450) { throw "Nsight window size too small: $Width x $Height." }
                $Bitmap = New-Object System.Drawing.Bitmap($Width, $Height)
                $Graphics = [System.Drawing.Graphics]::FromImage($Bitmap)
                $Hdc = $Graphics.GetHdc()
                try {
                  $Captured = [NcuWindowCapture]::PrintWindow($WindowProcess.MainWindowHandle, $Hdc, 2)
                } finally {
                  $Graphics.ReleaseHdc($Hdc)
                  $Graphics.Dispose()
                }
                if (-not $Captured) { $Bitmap.Dispose(); throw 'PrintWindow returned false; no screenshot file was accepted.' }
                $UniqueColours = New-Object 'System.Collections.Generic.HashSet[string]'
                for ($Y = 0; $Y -lt $Height; $Y += [Math]::Max(1, [int]($Height / 12))) {
                  for ($X = 0; $X -lt $Width; $X += [Math]::Max(1, [int]($Width / 12))) {
                    $Pixel = $Bitmap.GetPixel($X, $Y)
                    [void]$UniqueColours.Add("$($Pixel.R),$($Pixel.G),$($Pixel.B)")
                  }
                }
                if ($UniqueColours.Count -lt 20) { $Bitmap.Dispose(); throw 'Captured window was nearly uniform/blank; screenshot rejected.' }
                $OutFile = Join-Path $ScreenshotDir "$($Entry.Label).png"
                $Bitmap.Save($OutFile, [System.Drawing.Imaging.ImageFormat]::Png)
                $Bitmap.Dispose()
                $Manifest += [pscustomobject]@{ Label=$Entry.Label; Report=$ReportFile; Screenshot=$OutFile; Width=$Width; Height=$Height; SampledColours=$UniqueColours.Count; CapturedAt=(Get-Date).ToString('o') }
                "SNAPSHOT_CAPTURED=$($Entry.Label) FILE=$OutFile SIZE=$($Width)x$($Height)" | Tee-Object -FilePath cutile-ncu-screenshot-status.log -Append
              } catch {
                "SNAPSHOT_FAILED=$($Entry.Label) ERROR=$($_.Exception.Message)" | Tee-Object -FilePath cutile-ncu-screenshot-status.log -Append
              }
            }
            $Manifest | Export-Csv -NoTypeInformation -Encoding UTF8 -Path (Join-Path $ScreenshotDir 'manifest.csv')
            "NCU_GUI_SNAPSHOTS=$($Manifest.Count)" | Tee-Object -FilePath cutile-ncu-screenshot-status.log -Append
          }

                    'PROFILE_REPORTS_CREATED=True' | Tee-Object -FilePath cutile-ncu-profile-status.log -Append

      - name: Upload actual-cuTile reports and metric exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutile-rtx4060-ncu-profiles
          path: |
            cutile-ncu-profile-status.log
            cutile-profile-medium.log
            cutile-profile-long-batched.log
            cutile-profile-medium-stalls.log
            cutile-profile-long-batched-stalls.log
            results/cutile-profile-medium-stalls.ncu-repz
            results/cutile-profile-medium-stalls.ncu-rep
            results/cutile-profile-medium-stalls-details.txt
            results/cutile-profile-medium-stalls-raw.csv
            results/cutile-profile-long-batched-stalls.ncu-repz
            results/cutile-profile-long-batched-stalls.ncu-rep
            results/cutile-profile-long-batched-stalls-details.txt
            results/cutile-profile-long-batched-stalls-raw.csv
            results/cutile-profile-medium.ncu-repz
            results/cutile-profile-medium.ncu-rep
            results/cutile-profile-medium-details.txt
            results/cutile-profile-medium-raw.csv
            results/cutile-profile-long-batched.ncu-repz
            results/cutile-profile-long-batched.ncu-rep
            results/cutile-profile-long-batched-details.txt
            results/cutile-profile-long-batched-raw.csv
            cutile-profile-medium-latency4.log
            results/cutile-profile-medium-latency4.ncu-repz
            results/cutile-profile-medium-latency4.ncu-rep
            results/cutile-profile-medium-latency4-details.txt
            results/cutile-profile-medium-latency4-raw.csv
            cutile-profile-medium-latency8.log
            results/cutile-profile-medium-latency8.ncu-repz
            results/cutile-profile-medium-latency8.ncu-rep
            results/cutile-profile-medium-latency8-details.txt
            results/cutile-profile-medium-latency8-raw.csv
            cutile-profile-long-batched-latency4.log
            results/cutile-profile-long-batched-latency4.ncu-repz
            results/cutile-profile-long-batched-latency4.ncu-rep
            results/cutile-profile-long-batched-latency4-details.txt
            results/cutile-profile-long-batched-latency4-raw.csv
            cutile-profile-long-batched-latency8.log
            results/cutile-profile-long-batched-latency8.ncu-repz
            results/cutile-profile-long-batched-latency8.ncu-rep
            results/cutile-profile-long-batched-latency8-details.txt
            results/cutile-profile-long-batched-latency8-raw.csv
          if-no-files-found: error
