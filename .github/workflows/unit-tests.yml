name: CPU reference tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cpu-reference-tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Syntax-check mentor numerical and benchmark scripts
        run: python -m py_compile scripts/mentor_numerical_matrix.py benchmarks/benchmark_attention_sessions.py benchmarks/benchmark_attention.py benchmarks/benchmark_load_latency_hints.py
      - run: python -m pytest -q
