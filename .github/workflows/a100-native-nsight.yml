name: A100 native CUDA Nsight profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/shared_tile_cuda_attention.py"
      - "benchmarks/profile_shared_tile.py"
      - ".github/workflows/a100-native-nsight.yml"

concurrency:
  group: a100-native-nsight-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent native environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup_native_env.sh

      - name: Verify runner and Nsight access
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi --query-gpu=index,name,driver_version,compute_cap --format=csv
          command -v ncu
          ncu --version

      - name: Profile representative fused cases
        env:
          REQUIRE_A100: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/nsight
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"

          ncu --set full             --target-processes all             --force-overwrite             --export "results/nsight/${stamp}_A100_shared_medium_d128_tk64.ncu-rep"             "${NATIVE_VENV}/bin/python" benchmarks/profile_shared_tile.py               --case medium_d128 --tile-k 64 --warmup 5

          ncu --set full             --target-processes all             --force-overwrite             --export "results/nsight/${stamp}_A100_shared_longer_batched_d128_tk32.ncu-rep"             "${NATIVE_VENV}/bin/python" benchmarks/profile_shared_tile.py               --case longer_batched_d128 --tile-k 32 --warmup 5

      - name: Upload Nsight reports
        uses: actions/upload-artifact@v4
        with:
          name: a100-native-nsight-${{ github.run_id }}
          path: results/nsight/
          if-no-files-found: error
