          w=csv.writer(buf);w.writerow(fields)
          for d in data:
           m=d["m"];s=d["status"]
           w.writerow([d["name"],s.get("case"),s.get("tile_q"),s.get("tile_k"),s.get("load_latency"),d["duration_us"],d["unit"],m["compute"],m["memory"],m["dram"],m["bw"],m["l2_hit"],m["no_eligible"],m["eligible"],m["regs"],m["shared"],m["theoretical"],m["achieved"],m["limit_shared"],m["local_spills"],m["shared_spills"]])
