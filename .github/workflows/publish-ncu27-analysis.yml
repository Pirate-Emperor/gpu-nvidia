          # Create one Git commit containing all 30 documents using Git Data API.
          entries=[]
          for path,content in local.items():
            b64=base64.b64encode(content.encode("utf-8")).decode("ascii")
            blob=api("POST","/git/blobs",{"content":b64,"encoding":"base64"})
            entries.append({"path":path,"mode":"100644","type":"blob","sha":blob["sha"]})
          print("Created",len(entries),"documentation blobs.")
          for attempt in range(2):
            ref=api("GET","/git/ref/heads/main")
            parent=ref["object"]["sha"]
            commit0=api("GET","/git/commits/"+parent)
            tree=api("POST","/git/trees",{"base_tree":commit0["tree"]["sha"],"tree":entries})
            commit=api("POST","/git/commits",{"message":"Add full screenshot-by-screenshot analysis for 27 RTX 4060 NCU profiles","tree":tree["sha"],"parents":[parent]})
            try:
              api("PATCH","/git/refs/heads/main",{"sha":commit["sha"],"force":False})
              print("PUBLISHED_COMMIT="+commit["sha"])
              break
            except Exception:
              if attempt:raise
              time.sleep(3)
          print("INDEX_URL=https://github.com/xemptynothing/gpu-nvidia/blob/main/docs/ncu/rtx4060/27-profile-gui-analysis/README.md")
