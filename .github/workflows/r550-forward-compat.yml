name: R550 forward compatibility experiment

on:
  push:
    paths:
      - ".github/workflows/r550-forward-compat.yml"
      - "src/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: r550-forward-compat-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, gpu, a100]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Probe node
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 scripts/with_core_config.py bash -lc '
            set -euo pipefail
            echo "=== GPU ==="
            nvidia-smi --query-gpu=name,driver_version,memory.total,compute_cap --format=csv
            echo "=== CUDA ==="
            command -v nvcc || true
            nvcc --version 2>/dev/null || true
            echo "=== CUDA module command ==="
            command -v module || true
            echo "=== Known compatibility directories ==="
            for d in /usr/local/cuda-13.4/compat /usr/local/cuda-13.3/compat /usr/local/cuda-13.2/compat /opt/cuda-13.4/compat /opt/cuda-13.3/compat /opt/cuda-13.2/compat "$HOME"/cuda-13.4/compat "$HOME"/cuda-13.3/compat "$HOME"/cuda-13.2/compat; do
              if [ -d "$d" ]; then
                echo "FOUND: $d"
                ls -1 "$d" | head -50
              fi
            done
          '

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 scripts/with_core_config.py python3 -m venv .venv-r550
          python3 scripts/with_core_config.py .venv-r550/bin/python -m pip install --upgrade pip
          python3 scripts/with_core_config.py .venv-r550/bin/python -m pip install -r requirements-dev.txt
          python3 scripts/with_core_config.py .venv-r550/bin/python -m pip install "cupy-cuda13x" "cuda-tile[tileiras]"

      - name: Test native CUDA runtime
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-r550/bin/python -c "import cupy as cp; print('CuPy:', cp.__version__); print(cp.cuda.runtime.runtimeGetVersion()); print(cp.cuda.runtime.getDeviceProperties(0)['name'])"

      - name: Test cuTile without compatibility override
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/tests:$HOME:${PYTHONPATH:-}"
          .venv-r550/bin/python scripts/with_core_config.py -c 'import numpy as np; from cutile_attention import forward; q=np.zeros((1,1,64,32),dtype=np.float16); k=np.zeros((1,1,64,32),dtype=np.float16); v=np.ones((1,1,64,32),dtype=np.float16); o=forward(q,k,v,tile_q=64,tile_k=64); print("SUCCESS",o.shape,o.dtype,float(o[0,0,0,0]))'

      - name: Attempt apt download of user-space compat package
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p compat-experiment
          export PYTHONPATH="$HOME:${PYTHONPATH:-}"
          python3 scripts/with_core_config.py bash -lc 'cd compat-experiment && if command -v apt-get >/dev/null 2>&1; then apt-get download cuda-compat-13-4; else echo "apt-get unavailable"; fi'
          find compat-experiment -maxdepth 1 -type f -printf "%f\n" | head -20

      - name: Test cuTile with locally extracted compatibility package
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          COMPAT_DIR=""
          for d in compat-experiment/root/usr/local/cuda-*/compat; do
            if [ -d "$d" ]; then COMPAT_DIR="$d"; break; fi
          done
          if [ -z "$COMPAT_DIR" ]; then
            for d in /usr/local/cuda*/compat /opt/cuda*/compat "$HOME"/cuda*/compat "$HOME"/.local/cuda*/compat; do
              if [ -d "$d" ]; then COMPAT_DIR="$d"; break; fi
            done
          fi
          if [ -z "$COMPAT_DIR" ]; then
            echo "No user-space CUDA compatibility directory available."
            exit 0
          fi
          echo "Using compatibility directory: $COMPAT_DIR"
          export LD_LIBRARY_PATH="$COMPAT_DIR:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="$PWD/src:$PWD/tests:$HOME:${PYTHONPATH:-}"
          .venv-r550/bin/python scripts/with_core_config.py -c 'import cupy as cp; print("CUDA runtime:",cp.cuda.runtime.runtimeGetVersion()); print("device:",cp.cuda.runtime.getDeviceProperties(0)["name"])'
          .venv-r550/bin/python scripts/with_core_config.py -c 'import numpy as np; from cutile_attention import forward; q=np.zeros((1,1,64,32),dtype=np.float16); k=np.zeros((1,1,64,32),dtype=np.float16); v=np.ones((1,1,64,32),dtype=np.float16); o=forward(q,k,v,tile_q=64,tile_k=64); print("COMPAT cuTile SUCCESS",o.shape,o.dtype,float(o[0,0,0,0]))'
