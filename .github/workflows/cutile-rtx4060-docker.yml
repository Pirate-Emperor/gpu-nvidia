name: RTX 4060 native Windows cuTile validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutile-validation:
    if: github.ref == 'refs/heads/main'
    # Use the normal Windows self-hosted runner on the actual RTX 4060 host.
    # No Docker/WSL layer is needed: native Windows cuTile smoke already passed.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4

      - name: Create isolated Python environment and install cuTile dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          nvidia-smi
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed; GPU is not visible to the runner.' }

          python -m venv .venv-runner
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create Python virtual environment.' }
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'

          & $Py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $Py -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Development dependency installation failed.' }
          & $Py -m pip install 'cupy-cuda13x[ctk]' 'cuda-tile[tileiras]'
          if ($LASTEXITCODE -ne 0) { throw 'cuTile/CuPy installation failed.' }

      - name: Genuine cuTile compiler/runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'
          & $Py scripts/cutile_smoke.py 2>&1 | Tee-Object -FilePath cutile-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Genuine cuTile smoke test failed.' }
          if (-not (Select-String -Path cutile-smoke.log -SimpleMatch 'OUTPUT_CHECK=PASS' -Quiet)) {
            throw 'Smoke log does not contain OUTPUT_CHECK=PASS.'
          }
          if (-not (Select-String -Path cutile-smoke.log -SimpleMatch 'CUTILE_SMOKE=PASS' -Quiet)) {
            throw 'Smoke log does not contain CUTILE_SMOKE=PASS.'
          }

      - name: Run actual cuTile attention correctness matrix
        shell: pwsh
        env:
          REQUIRE_CUTILE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'
          & $Py -m pytest -q tests/test_gpu_correctness.py tests/test_gpu_edge_cases.py 2>&1 |
            Tee-Object -FilePath cutile-pytest.log
          if ($LASTEXITCODE -ne 0) { throw 'Required actual cuTile attention correctness tests failed.' }

      - name: Verify required CLI input/output against independent reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'
          & $Py scripts/generate_inputs.py --output cutile-cli-input.npz --seq 64 --head-dim 32 --seed 20261018
          if ($LASTEXITCODE -ne 0) { throw 'CLI input generation failed.' }
          & $Py run_attention.py --input cutile-cli-input.npz --output cutile-cli-output.npy --backend cutile --tile-q 64 --tile-k 64
          if ($LASTEXITCODE -ne 0) { throw 'Required CLI execution failed.' }

          & $Py scripts/verify_cli_output.py --input cutile-cli-input.npz --output cutile-cli-output.npy
          if ($LASTEXITCODE -ne 0) { throw 'CLI output/reference validation failed.' }

      - name: Benchmark fused cuTile against unfused CuPy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'
          New-Item -ItemType Directory -Force -Path results | Out-Null
          & $Py benchmarks/benchmark_attention.py --output results/cutile-benchmark.json --warmup 10 --iterations 30 --tiles 32x64 64x64 2>&1 |
            Tee-Object -FilePath cutile-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'cuTile benchmark failed.' }

      - name: Capture two actual cuTile profiles when Nsight Compute is already installed
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Ncu = Get-Command ncu.exe -ErrorAction SilentlyContinue
          $NcuPath = if ($Ncu) { $Ncu.Source } else { $null }
          if (-not $NcuPath) {
            $InstallRoot = Join-Path $env:ProgramFiles 'NVIDIA Corporation'
            if (Test-Path $InstallRoot) {
              $Candidate = Get-ChildItem -Path $InstallRoot -Filter ncu.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($Candidate) { $NcuPath = $Candidate.FullName }
            }
          }
          if (-not $NcuPath) {
            'NCU_NOT_INSTALLED: profiles were not captured; no tool was installed automatically.' | Tee-Object -FilePath cutile-profile-status.log
            exit 0
          }

          New-Item -ItemType Directory -Force -Path results | Out-Null
          $Py = Join-Path $PWD '.venv-runner\Scripts\python.exe'

          & $NcuPath --set basic --force-overwrite -o results/cutile-profile-medium $Py benchmarks/profile_fused.py --case medium_d128 --tile-q 64 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-medium.log
          $MediumExit = $LASTEXITCODE
          & $NcuPath --set basic --force-overwrite -o results/cutile-profile-long-batched $Py benchmarks/profile_fused.py --case longer_batched_d128 --tile-q 32 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-long-batched.log
          $LongExit = $LASTEXITCODE
          if ($MediumExit -ne 0 -or $LongExit -ne 0) {
            throw "Nsight Compute failed (medium=$MediumExit, long/batched=$LongExit). Inspect profile logs for counter permissions or unsupported options."
          }

      - name: Upload actual cuTile validation and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutile-rtx4060-native-validation-${{ github.run_id }}
          path: |
            cutile-smoke.log
            cutile-pytest.log
            cutile-benchmark.log
            cutile-profile-status.log
            cutile-profile-medium.log
            cutile-profile-long-batched.log
            results/cutile-profile-medium.ncu-rep
            results/cutile-profile-long-batched.ncu-rep
            cutile-cli-input.npz
            cutile-cli-output.npy
            results/cutile-benchmark.json
            results/cutile-benchmark.csv
          if-no-files-found: warn
