name: RTX 4060 native Windows cuTile validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutile-rtx4060-docker.yml"
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
      - "run_attention.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutile-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Inventory GPU and reuse existing local cuTile environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $NvidiaSmi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if (-not $NvidiaSmi) { $NvidiaSmi = Get-Command nvidia-smi -ErrorAction SilentlyContinue }
          if (-not $NvidiaSmi) { throw 'nvidia-smi is unavailable on PATH; stopping without installing tools.' }
          $GpuInventory = & $NvidiaSmi.Source --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader
          if ($LASTEXITCODE -ne 0) { throw 'GPU inventory failed.' }
          $GpuInventory | Tee-Object -FilePath cutile-environment.log
          if (-not ($GpuInventory -match 'RTX 4060')) { throw "Expected the local RTX 4060 runner; found: $GpuInventory" }

          # The Actions checkout lives under actions-runner\_work, inside the
          # project root. Search only this repository directory for existing
          # virtual environments; never install or download dependencies.
          $ProjectRoot = (Resolve-Path (Join-Path $PWD '..\..\..\..')).Path
          "PROJECT_ROOT=$ProjectRoot" | Tee-Object -FilePath cutile-environment.log -Append
          $Candidates = New-Object System.Collections.Generic.List[string]
          $RootVenvs = Get-ChildItem -LiteralPath $ProjectRoot -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'venv|virtual' -or $_.Name -in @('env') }
          foreach ($Venv in $RootVenvs) {
            $Candidate = Join-Path $Venv.FullName 'Scripts\python.exe'
            if (Test-Path $Candidate) { $Candidates.Add($Candidate) }
          }
          $Candidates.Add((Join-Path $PWD '.venv-cutile-windows\Scripts\python.exe'))
          $Candidates.Add((Join-Path $ProjectRoot '.venv-cutile-windows\Scripts\python.exe'))
          $PyCommand = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($PyCommand) { $Candidates.Add($PyCommand.Source) }
          $PyLauncher = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($PyLauncher) {
            $InstalledPython = & $PyLauncher.Source -0p 2>&1
            $InstalledPython | Tee-Object -FilePath cutile-environment.log -Append
            foreach ($Line in $InstalledPython) {
              if ($Line -match '([A-Za-z]:\\.+python\.exe)\s*$') { $Candidates.Add($Matches[1]) }
            }
          }

          $Py = $null
          foreach ($Candidate in ($Candidates | Select-Object -Unique)) {
            if (-not (Test-Path $Candidate)) { continue }
            "CHECK_PYTHON=$Candidate" | Tee-Object -FilePath cutile-environment.log -Append
            $PreviousErrorPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $Probe = & $Candidate -c "import numpy, cupy, cuda.tile, pytest; import importlib.metadata as m; print('numpy='+numpy.__version__); print('cupy='+cupy.__version__); print('cuda-tile='+m.version('cuda-tile')); print('pytest='+pytest.__version__)" 2>&1
            $CandidateExit = $LASTEXITCODE
            $ErrorActionPreference = $PreviousErrorPreference
            $Probe | ForEach-Object { $_.ToString() } | Tee-Object -FilePath cutile-environment.log -Append
            "PYTHON_PROBE_EXIT=$CandidateExit" | Tee-Object -FilePath cutile-environment.log -Append
            if ($CandidateExit -eq 0) { $Py = $Candidate; break }
          }
          if (-not $Py) {
            throw 'No existing Python environment under the project root can import NumPy, CuPy, cuda.tile and pytest. No packages were installed or downloaded; see the recorded candidate probes.'
          }
          "PYTHON_EXE=$Py" | Tee-Object -FilePath cutile-environment.log -Append
          & $Py --version 2>&1 | Tee-Object -FilePath cutile-environment.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Selected existing project Python failed.' }

      - name: Compile and launch genuine cuTile smoke kernel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Py = Get-Content cutile-environment.log | Where-Object { $_ -like 'PYTHON_EXE=*' } | Select-Object -First 1
          if (-not $Py) { throw 'Python path record is missing.' }
          $Py = $Py.Substring('PYTHON_EXE='.Length)
          & $Py scripts/cutile_smoke.py 2>&1 | Tee-Object -FilePath cutile-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Genuine cuTile smoke test failed.' }
          if (-not (Select-String -Path cutile-smoke.log -SimpleMatch 'OUTPUT_CHECK=PASS' -Quiet)) { throw 'Smoke output check did not pass.' }
          if (-not (Select-String -Path cutile-smoke.log -SimpleMatch 'CUTILE_SMOKE=PASS' -Quiet)) { throw 'cuTile smoke gate did not pass.' }

      - name: Run required actual cuTile attention correctness matrix
        shell: powershell
        env:
          REQUIRE_CUTILE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PyRecord = Get-Content cutile-environment.log | Where-Object { $_ -like 'PYTHON_EXE=*' } | Select-Object -First 1
          $Py = $PyRecord.Substring('PYTHON_EXE='.Length)
          "REQUIRE_CUTILE=$env:REQUIRE_CUTILE" | Tee-Object -FilePath cutile-pytest.log
          & $Py -m pytest -q -ra tests/test_gpu_correctness.py tests/test_gpu_edge_cases.py 2>&1 | Tee-Object -FilePath cutile-pytest.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Required actual cuTile attention correctness matrix failed.' }

      - name: Exercise CLI and verify output against independent NumPy oracle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PyRecord = Get-Content cutile-environment.log | Where-Object { $_ -like 'PYTHON_EXE=*' } | Select-Object -First 1
          $Py = $PyRecord.Substring('PYTHON_EXE='.Length)
          & $Py scripts/generate_inputs.py --output cutile-cli-input.npz --seq 64 --head-dim 32 --seed 20261018
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic CLI input generation failed.' }
          & $Py run_attention.py --input cutile-cli-input.npz --output cutile-cli-output.npy --backend cutile --tile-q 64 --tile-k 64 2>&1 | Tee-Object -FilePath cutile-cli.log
          if ($LASTEXITCODE -ne 0) { throw 'CLI inference failed.' }
          & $Py scripts/verify_cli_output.py --input cutile-cli-input.npz --output cutile-cli-output.npy 2>&1 | Tee-Object -FilePath cutile-cli-reference.log
          if ($LASTEXITCODE -ne 0) { throw 'CLI output mismatches the independent NumPy reference.' }

      - name: Benchmark fused cuTile versus unfused CuPy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PyRecord = Get-Content cutile-environment.log | Where-Object { $_ -like 'PYTHON_EXE=*' } | Select-Object -First 1
          $Py = $PyRecord.Substring('PYTHON_EXE='.Length)
          New-Item -ItemType Directory -Force -Path results | Out-Null
          & $Py benchmarks/benchmark_attention.py --output results/cutile-benchmark.json --warmup 10 --iterations 30 --tiles 32x64 64x64 2>&1 | Tee-Object -FilePath cutile-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'Controlled cuTile benchmark failed.' }

      - name: Attempt two genuine cuTile Nsight Compute captures if already installed
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Ncu = Get-Command ncu.exe -ErrorAction SilentlyContinue
          $NcuPath = if ($Ncu) { $Ncu.Source } else { $null }
          if (-not $NcuPath) {
            $InstallRoot = Join-Path $env:ProgramFiles 'NVIDIA Corporation'
            if (Test-Path $InstallRoot) {
              $Candidate = Get-ChildItem -Path $InstallRoot -Filter ncu.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($Candidate) { $NcuPath = $Candidate.FullName }
            }
          }
          if (-not $NcuPath) {
            'NCU_NOT_INSTALLED: no profiles captured; no download/install attempted.' | Tee-Object -FilePath cutile-profile-status.log
            exit 0
          }
          $PyRecord = Get-Content cutile-environment.log | Where-Object { $_ -like 'PYTHON_EXE=*' } | Select-Object -First 1
          $Py = $PyRecord.Substring('PYTHON_EXE='.Length)
          New-Item -ItemType Directory -Force -Path results | Out-Null
          & $NcuPath --set basic --force-overwrite -o results/cutile-profile-medium $Py benchmarks/profile_fused.py --case medium_d128 --tile-q 64 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-medium.log
          $MediumExit = $LASTEXITCODE
          & $NcuPath --set basic --force-overwrite -o results/cutile-profile-long-batched $Py benchmarks/profile_fused.py --case longer_batched_d128 --tile-q 32 --tile-k 64 --warmup 5 2>&1 | Tee-Object -FilePath cutile-profile-long-batched.log
          $LongExit = $LASTEXITCODE
          if ($MediumExit -ne 0 -or $LongExit -ne 0) { throw "Nsight Compute failed (medium=$MediumExit, long/batched=$LongExit). Inspect counter permission errors." }

      - name: Upload complete run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutile-rtx4060-experiment
          path: |
            cutile-environment.log
            cutile-smoke.log
            cutile-pytest.log
            cutile-cli.log
            cutile-cli-reference.log
            cutile-benchmark.log
            cutile-profile-status.log
            cutile-profile-medium.log
            cutile-profile-long-batched.log
            cutile-cli-input.npz
            cutile-cli-output.npy
            results/cutile-benchmark.json
            results/cutile-benchmark.csv
            results/cutile-profile-medium.ncu-rep
            results/cutile-profile-long-batched.ncu-rep
          if-no-files-found: warn
